spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon's free tier can suspend idle connections; fail fast instead of hanging.
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    hibernate:
      # "update" is fine for a portfolio project; use migrations (Flyway/Liquibase)
      # if this ever needs to survive real production schema changes.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false
